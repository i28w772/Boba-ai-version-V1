<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boba AI — Expert Companion 🧋</title>
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f5ebe0">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23f5ebe0%22/><text y=%22130%22 x=%2225%22 font-size=%22110%22>🧋</text></svg>">
  
  <!-- Inline Manifest using Data URI -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkJvYmEgQUkgQ29tcGFuaW9uIiwKICAic2hvcnRfbmFtZSI6ICJCb2JhIEFJIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmNWViZTAiLAogICJ0aGVtZV9jb2xvciI6ICIjZjVlYmUwIiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiZGF0YTppbWFnZS9zdmcreG1sLDxzdmcgeG1sbnM9XCJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2Z1wiIHZpZXdCb3g9XCIwIDAgMTkyIDE5MlwiIHdpZHRoPVwiMTkyXCIgaGVpZ2h0PVwiMTkyXCI+PHJlY3Qgd2lkdGg9XCIxMDAlXCIgaGVpZ2h0PVwiMTAwJVwiIGZpbGw9XCIjZjVlYmUwXCIvPjx0ZXh0IHk9XCIxMzBcIiB4PVwiMjVcIiBmb250LXNpemU9XCIxMTBcIj7wn6GLPC90ZXh0Pjwvc3ZnPiIsCiAgICAgICJzaXplcyI6ICIxOTJ4MTkyIiwKICAgICAgInR5cGUiOiAiaW1hZ2Uvc3ZnK3htbCIKICAgIH0KICBdCn0=">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #faf6f0;
      --bubble-user: #4a3728;
      --bubble-user-text: #ffffff;
      --bubble-boba: #f5ebe0;
      --bubble-boba-text: #3d2a1e;
      --accent: #d4a373;
      --accent-hover: #c68b59;
      --border-color: #e3d5ca;
      --text-main: #3d2a1e;
      --text-muted: #7f6a5b;
      --shadow-sm: 0 2px 8px rgba(74, 55, 40, 0.05);
      --shadow-md: 0 4px 20px rgba(74, 55, 40, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      font-size: 28px;
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border-color);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }

    .icon-btn:hover {
      background-color: var(--bubble-boba);
      border-color: var(--accent);
    }

    /* Main Container Layout */
    .app-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg-color);
    }

    .messages-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeInUp 0.3s ease forwards;
    }

    .msg-wrapper.user {
      align-self: flex-end;
    }

    .msg-wrapper.assistant {
      align-self: flex-start;
    }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
    }

    .user .msg-bubble {
      background-color: var(--bubble-user);
      color: var(--bubble-user-text);
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .assistant .msg-bubble {
      background-color: #ffffff;
      color: var(--bubble-boba-text);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .msg-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    .user .msg-meta {
      text-align: right;
    }

    /* System / Tool logs */
    .system-log {
      align-self: center;
      background-color: #eae0d5;
      color: #5e503f;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 20px;
      max-width: 90%;
      text-align: center;
      font-family: monospace;
      border: 1px dashed var(--border-color);
    }

    /* Input Dock Area */
    .input-dock {
      background-color: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.02);
    }

    /* Suggestion Pills */
    .suggestions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
    }

    .suggestions::-webkit-scrollbar {
      height: 4px;
    }
    .suggestions::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 2px;
    }

    .pill {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .pill:hover {
      background-color: var(--bubble-boba);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Form input box */
    .input-row {
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .chat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.15);
    }

    .send-btn {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .send-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Settings Panel Sidebar / Drawer */
    .settings-drawer {
      position: absolute;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100%;
      background-color: #ffffff;
      border-left: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      z-index: 20;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .settings-drawer.open {
      right: 0;
    }

    .settings-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-header h2 {
      font-size: 16px;
      font-weight: 800;
    }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .setting-group input, .setting-group select, .setting-group textarea {
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .setting-group input:focus, .setting-group select:focus, .setting-group textarea:focus {
      border-color: var(--accent);
    }

    .save-settings-btn {
      background-color: var(--bubble-user);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s ease;
    }

    .save-settings-btn:hover {
      opacity: 0.9;
    }

    /* Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .settings-drawer {
        width: 100%;
        right: -100%;
      }
      .msg-wrapper {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="brand">
      <span class="brand-logo">🧋</span>
      <div class="brand-text">
        <h1>Boba AI</h1>
        <span>Expert System Active</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="clearConversation()" title="Clear chat">🗑️</button>
      <button class="icon-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- Container -->
  <div class="app-body">
    <!-- Chat Container -->
    <div class="chat-container">
      <div class="messages-view" id="messages-view">
        <!-- Greetings bubble will render on load -->
      </div>

      <!-- Dock -->
      <div class="input-dock">
        <!-- Recommendation suggestions -->
        <div class="suggestions" id="suggestions-box">
          <!-- Suggestion pills injected here -->
        </div>

        <!-- Text submission row -->
        <div class="input-row">
          <input type="text" id="user-input" class="chat-input" placeholder="What are we building today?..." onkeydown="handleKey(event)">
          <button class="send-btn" onclick="sendMessage()">Send ➔</button>
        </div>
      </div>
    </div>

    <!-- Settings Drawer -->
    <div class="settings-drawer" id="settings-drawer">
      <div class="settings-header">
        <h2>Settings & Engine Profiles</h2>
        <button class="icon-btn" onclick="toggleSettings()">✕</button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <label for="provider-select">AI Provider</label>
          <select id="provider-select" onchange="handleProviderChange()">
            <option value="offline">Boba Offline Fallback (Free / No Key)</option>
            <option value="gemini">Google Gemini API</option>
            <option value="openai">OpenAI API</option>
          </select>
        </div>

        <div class="setting-group">
          <label for="api-key-input">API Key</label>
          <input type="password" id="api-key-input" placeholder="Paste your API key here...">
        </div>

        <div class="setting-group" id="model-group">
          <label for="model-input">Model Name</label>
          <input type="text" id="model-input" value="gemini-1.5-flash">
        </div>

        <div class="setting-group">
          <label for="temperature-input">Temperature</label>
          <input type="number" id="temperature-input" min="0" max="2" step="0.1" value="0.7">
        </div>

        <div class="setting-group">
          <label for="location-input">Current Location</label>
          <input type="text" id="location-input" value="Los Angeles, CA">
        </div>

        <div class="setting-group">
          <label for="system-prompt">System Prompt</label>
          <textarea id="system-prompt" rows="4">You are Boba AI 🧋, a warm, clever, and helpful companion. Keep boba-related metaphors subtle, clever, and rare.</textarea>
        </div>

        <button class="save-settings-btn" onclick="saveSettings()">Save & Update Profile</button>
      </div>
    </div>
  </div>

  <script>
    // System Settings Configuration State
    let config = {
      provider: 'offline',
      apiKey: '',
      modelName: 'gemini-1.5-flash',
      temperature: 0.7,
      location: 'Los Angeles, CA',
      systemPrompt: 'You are Boba AI 🧋, a warm, clever, and helpful companion. Keep boba-related metaphors subtle, clever, and rare.'
    };

    // Chat History
    let history = [];

    // Load configurations from storage if present
    window.onload = () => {
      const stored = localStorage.getItem('boba_ai_config');
      if (stored) {
        config = JSON.parse(stored);
        document.getElementById('provider-select').value = config.provider;
        document.getElementById('api-key-input').value = config.apiKey;
        document.getElementById('model-input').value = config.modelName;
        document.getElementById('temperature-input').value = config.temperature;
        document.getElementById('location-input').value = config.location;
        document.getElementById('system-prompt').value = config.systemPrompt;
      }
      handleProviderChange();
      resetConversation();
      renderSuggestions();
    };

    function handleProviderChange() {
      const provider = document.getElementById('provider-select').value;
      const modelInput = document.getElementById('model-input');
      
      if (provider === 'gemini') {
        modelInput.value = 'gemini-1.5-flash';
      } else if (provider === 'openai') {
        modelInput.value = 'gpt-4o-mini';
      } else {
        modelInput.value = 'Boba-Native-Local';
      }
    }

    function toggleSettings() {
      document.getElementById('settings-drawer').classList.toggle('open');
    }

    function saveSettings() {
      config.provider = document.getElementById('provider-select').value;
      config.apiKey = document.getElementById('api-key-input').value;
      config.modelName = document.getElementById('model-input').value;
      config.temperature = parseFloat(document.getElementById('temperature-input').value);
      config.location = document.getElementById('location-input').value;
      config.systemPrompt = document.getElementById('system-prompt').value;

      localStorage.setItem('boba_ai_config', JSON.stringify(config));
      toggleSettings();
      appendLog("System configs updated. Profile saved successfully! 🧋");
    }

    // Dynamic Suggestion Actions
    function renderSuggestions() {
      const suggestionsBox = document.getElementById('suggestions-box');
      const items = [
        { label: "What's the weather like? ☀️", prompt: "What's the weather in my location?", icon: "☀️" },
        { label: "Let's crunch some numbers 🧮", prompt: "Can you help me compute: 120 * (45 + 15)?", icon: "🧮" },
        { label: "What are you capable of? 🧋", prompt: "Give me a tour of your features and offline tools!", icon: "🧋" }
      ];

      suggestionsBox.innerHTML = '';
      items.forEach(item => {
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.onclick = () => {
          document.getElementById('user-input').value = item.prompt;
          sendMessage();
        };
        pill.innerHTML = `<span>${item.icon}</span> ${item.label}`;
        suggestionsBox.appendChild(pill);
      });
    }

    function resetConversation() {
      history = [];
      const view = document.getElementById('messages-view');
      view.innerHTML = '';
      
      // Initial Greet Bubble
      appendMessage('assistant', "Welcome back! What are we building today? 🧋");
    }

    function clearConversation() {
      resetConversation();
      appendLog("Conversation memory wiped.");
    }

    function appendMessage(role, content) {
      const view = document.getElementById('messages-view');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerText = content;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      const now = new Date();
      meta.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      wrapper.appendChild(bubble);
      wrapper.appendChild(meta);
      view.appendChild(wrapper);
      view.scrollTop = view.scrollHeight;
    }

    function appendLog(text) {
      const view = document.getElementById('messages-view');
      const log = document.createElement('div');
      log.className = 'system-log';
      log.innerText = `[system_log]: ${text}`;
      view.appendChild(log);
      view.scrollTop = view.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    // Core Execution Loop
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage('user', prompt);
      input.value = '';

      // Slide older history window if needed
      if (history.length > 8) {
        history = history.slice(-6);
      }
      history.push({ role: 'user', content: prompt });

      // Check Tool triggers locally/globally
      const lowerPrompt = prompt.toLowerCase();
      if (lowerPrompt.includes('weather')) {
        appendLog(`Triggered get_weather for [${config.location}]`);
        setTimeout(() => {
          const weatherResult = `Right now in ${config.location}, it is 77°F and sunny ☀️ with 54% humidity. Perfect boba tea weather!`;
          appendMessage('assistant', weatherResult);
          history.push({ role: 'assistant', content: weatherResult });
        }, 600);
        return;
      }

      if (lowerPrompt.includes('*') || lowerPrompt.includes('/') || lowerPrompt.includes('+') || lowerPrompt.includes('-') || lowerPrompt.includes('compute')) {
        const expressionMatch = prompt.match(/[0-9+\-*/().\s]{3,}/g);
        if (expressionMatch) {
          const expression = expressionMatch[0].trim();
          appendLog(`Triggered local calculator for [${expression}]`);
          try {
            const res = new Function(`return (${expression})`)();
            setTimeout(() => {
              const calcResult = `Computed output: "${expression}" = ${res}. Clear math logic! 🧮`;
              appendMessage('assistant', calcResult);
              history.push({ role: 'assistant', content: calcResult });
            }, 600);
            return;
          } catch (e) {}
        }
      }

      // Offline flow vs Live API Calls
      if (config.provider === 'offline' || !config.apiKey) {
        appendLog("Offline Fallback: Responding locally.");
        setTimeout(() => {
          let reply = "I'm running on Offline mode. Fill in your API details in Settings ⚙️ to connect to OpenAI or Gemini engines! However, you can still test my simulated weather and math calculations natively anytime!";
          if (lowerPrompt.includes('tour') || lowerPrompt.includes('capable')) {
            reply = "I'm a PWA-ready helper! I support OpenAI and Gemini configurations. In offline mode, I natively support calculator features, weather projections for " + config.location + ", and system profile custom prompt configurations!";
          }
          appendMessage('assistant', reply);
          history.push({ role: 'assistant', content: reply });
        }, 600);
        return;
      }

      // Call API Endpoint
      try {
        appendLog(`Executing API Request to ${config.provider}...`);
        let responseContent = "";
        
        if (config.provider === 'openai') {
          responseContent = await callOpenAI();
        } else {
          responseContent = await callGemini();
        }

        appendMessage('assistant', responseContent);
        history.push({ role: 'assistant', content: responseContent });

      } catch (err) {
        appendLog(`Error matching provider response: ${err.message}`);
        appendMessage('assistant', "Uh oh! Something went sideways. Let's make sure your API key is correct and try again! 🧋");
      }
    }

    async function callOpenAI() {
      const messages = [{ role: 'system', content: config.systemPrompt }, ...history];
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify({
          model: config.modelName || 'gpt-4o-mini',
          messages: messages,
          temperature: config.temperature
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.choices[0].message.content;
    }

    async function callGemini() {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${config.modelName || 'gemini-1.5-flash'}:generateContent?key=${config.apiKey}`;
      const contents = history.map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      }));

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents,
          systemInstruction: { parts: [{ text: config.systemPrompt }] }
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response text received.';
    }

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'boba-ai-v1';
        const ASSETS = [
          '/',
          '/index.html'
        ];
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS)));
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(workerUrl)
        .then(() => console.log('🧋 Service Worker active inline!'))
        .catch(err => console.log('Service Worker registration failed: ', err));
    }
  </script>
</body>
</html>
